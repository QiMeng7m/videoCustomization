<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>锦言 · 祝词特效工坊</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <header class="site-header">
    <div class="logo">
      <span class="logo-icon">锦</span>
      <div>
        <h1>锦言祝词特效工坊</h1>
        <p>上传视频音乐合成 · 祝词特效叠加 · 导出完整视频</p>
      </div>
    </div>
    <button type="button" class="btn-ghost" id="btnRandom">✨ 随机灵感</button>
  </header>

  <main class="layout">
    <aside class="panel panel-controls">
      <section class="control-block">
        <h2><span class="step">01</span> 祝福场景</h2>
        <div class="scene-tabs" id="sceneTabs" role="tablist"></div>
      </section>

      <section class="control-block">
        <h2><span class="step">02</span> 精选祝词</h2>
        <div class="template-grid" id="templateGrid"></div>
      </section>

      <section class="control-block">
        <h2><span class="step">03</span> 自定义文案</h2>
        <textarea id="customText" rows="5" placeholder="在此输入或编辑您的祝词…&#10;支持换行，每行将按段落展示"></textarea>
        <div class="row-actions">
          <label class="checkbox">
            <input type="checkbox" id="showSignature" checked />
            <span>显示署名</span>
          </label>
          <input type="text" id="signature" class="input-sm" value="敬上" maxlength="12" />
        </div>
      </section>

      <section class="control-block media-block">
        <h2><span class="step">04</span> 自定义底素材</h2>
        <p class="block-desc">上传视频作背景，搭配背景音乐，再叠加祝词炫酷特效</p>

        <div class="upload-row">
          <label class="upload-btn">
            <input type="file" id="uploadVideo" accept="video/*" hidden />
            <span class="upload-icon">🎬</span>
            <span class="upload-title">上传视频</span>
            <span class="upload-name" id="videoFileName">未选择</span>
          </label>
          <button type="button" class="btn-clear" id="clearVideo" title="清除视频" hidden>×</button>
        </div>

        <div class="upload-row">
          <label class="upload-btn">
            <input type="file" id="uploadAudio" accept="audio/*" hidden />
            <span class="upload-icon">🎵</span>
            <span class="upload-title">上传音乐</span>
            <span class="upload-name" id="audioFileName">未选择</span>
          </label>
          <button type="button" class="btn-clear" id="clearAudio" title="清除音乐" hidden>×</button>
        </div>

        <div class="video-controls" id="videoControls" hidden>
          <p class="vc-title">视频调节</p>
          <label class="slider-label">
            播放速度 <span class="val-tag" id="speedVal">1.0×</span>
            <input type="range" id="videoSpeed" min="0.25" max="2.5" step="0.05" value="1" />
          </label>
          <label class="slider-label">
            视频原声音量 <span class="val-tag" id="videoVolVal">80%</span>
            <input type="range" id="videoVolume" min="0" max="1" step="0.05" value="0.8" />
          </label>
          <div class="trim-block">
            <div class="trim-head">
              <span>视频截取</span>
              <span class="trim-range-text" id="trimRangeText">00:00 – 00:00</span>
            </div>
            <div class="trim-track" id="trimTrack">
              <div class="trim-active" id="trimActive"></div>
            </div>
            <label class="slider-label trim-label">
              起点 <span class="val-tag" id="trimStartVal">00:00</span>
              <input type="range" id="trimStart" min="0" max="100" step="0.1" value="0" />
            </label>
            <label class="slider-label trim-label">
              终点 <span class="val-tag" id="trimEndVal">00:00</span>
              <input type="range" id="trimEnd" min="0" max="100" step="0.1" value="100" />
            </label>
            <p class="trim-hint" id="trimDurationHint">截取片段：0 秒</p>
          </div>
        </div>

        <div class="media-mix">
          <label class="slider-label">背景暗角（突出文字）
            <input type="range" id="bgOverlay" min="0" max="0.75" step="0.05" value="0.4" />
          </label>
          <label class="slider-label">特效层透明度
            <input type="range" id="fxOnVideo" min="0.2" max="1" step="0.05" value="0.85" />
          </label>
          <label class="slider-label">音乐音量
            <input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.85" />
          </label>
          <label class="checkbox">
            <input type="checkbox" id="useVideoAudio" />
            <span>保留视频原声（与音乐叠加）</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" id="previewMusic" checked />
            <span>预览时播放背景音乐</span>
          </label>
        </div>

        <button type="button" class="btn-compose" id="btnCompose">▶ 合成播放（视频+音乐+祝词特效）</button>
      </section>

      <section class="control-block highlight-block">
        <h2><span class="step">05</span> 炫酷特效风格</h2>
        <p class="block-desc">切换后立即在右侧实时预览粒子与光效</p>
        <div class="fx-picker" id="fxPicker"></div>
        <label class="slider-label">
          特效强度
          <input type="range" id="fxIntensity" min="0.4" max="1.5" step="0.1" value="1" />
        </label>
      </section>

      <section class="control-block">
        <h2><span class="step">06</span> 文字登场</h2>
        <div class="text-effect-picker" id="textEffectPicker"></div>
        <label class="slider-label">
          动画速度
          <input type="range" id="animSpeed" min="0.5" max="2" step="0.1" value="1" />
        </label>
      </section>

      <section class="control-block">
        <h2><span class="step">07</span> 细节微调</h2>
        <div class="fine-tune">
          <label>字号 <input type="range" id="fontSize" min="18" max="42" value="28" /></label>
          <label>字间距 <input type="range" id="letterSpacing" min="0" max="12" value="2" /></label>
        </div>
      </section>

      <section class="control-block">
        <h2><span class="step">08</span> 视频导出</h2>
        <div class="video-options">
          <label>录制时长
            <select id="videoDuration">
              <option value="5">5 秒</option>
              <option value="8" selected>8 秒</option>
              <option value="10">10 秒</option>
              <option value="15">15 秒</option>
              <option value="auto">跟随素材长度</option>
            </select>
          </label>
          <label>帧率
            <select id="videoFps">
              <option value="30" selected>30 FPS</option>
              <option value="60">60 FPS</option>
            </select>
          </label>
        </div>
      </section>

      <div class="action-bar">
        <button type="button" class="btn-primary" id="btnReplay">↺ 重播登场</button>
        <button type="button" class="btn-accent" id="btnExportVideo">⬇ 导出视频</button>
        <button type="button" class="btn-secondary" id="btnCopy">复制祝词</button>
      </div>
    </aside>

    <section class="panel panel-preview">
      <div class="preview-toolbar">
        <span class="badge live-badge"><span class="live-dot"></span> 实时特效预览</span>
        <span class="badge" id="previewBadge">新春 · 烟花绽放</span>
        <button type="button" class="btn-icon" id="btnFullscreen" title="全屏预览">⛶</button>
      </div>
      <div class="preview-viewport" id="previewViewport">
        <canvas id="previewCanvas" width="720" height="960"></canvas>
        <div class="recording-overlay" id="recordingOverlay" hidden>
          <div class="rec-pulse"></div>
          <p class="rec-text">正在录制视频…</p>
          <div class="rec-progress-wrap">
            <div class="rec-progress" id="recProgress"></div>
          </div>
          <span class="rec-time" id="recTime">0 / 8 秒</span>
        </div>
      </div>
      <p class="preview-hint">可上传视频+音乐合成底图，祝词特效叠加在最上层 · 点击「合成播放」同步预览 · 满意后「导出视频」含背景音乐</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
